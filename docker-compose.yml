# Starts the PostgreSQL database for local work: docker compose up -d db
# The backend and frontend services can be added under "services" by their owners.
services:
  db:
    image: postgres:16
    container_name: movies-db
    environment:
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - movies-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  movies-db-data:
