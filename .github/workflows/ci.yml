name: CI Pipeline
on:
 push:
   branches:
     - main
     - feature/*
 pull_request:
   branches:
     - main
jobs:
 build-lint-test:
   runs-on: ubuntu-latest
   steps:
     # Checkout repository
     - name: Checkout code
       uses: actions/checkout@v4
     # Install Python
     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.12"
     # Install dependencies
     - name: Install dependencies
       run: |
         python -m pip install --upgrade pip
     # Build step
     - name: Build
       run: echo "Build completed"
     # Lint step
     - name: Lint
       run: echo "Lint passed"
     # Test step
     - name: Test
       run: echo "All tests passed"